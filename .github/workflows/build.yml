name: Build FmOffice

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/engine.test.js

  windows:
    needs: test-engine
    runs-on: windows-latest
    env:
      FMOFFICE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            setup/src-tauri

      # ---- FmOffice Sheets (portable exe, zipped) ----
      - name: Generate Sheets icons
        run: npx --yes @tauri-apps/cli@2 icon assets/sheets-icon-1024.png --output src-tauri/icons
      - name: Build Sheets
        run: npx --yes @tauri-apps/cli@2 build --no-bundle
      - name: Zip Sheets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path src-tauri/target/release/fmoffice-sheets.exe -DestinationPath dist/FmOffice-Sheets-windows-x64.zip -Force

      # ---- FmOffice Setup (tiny installer that downloads from Releases) ----
      - name: Generate Setup icons
        working-directory: setup
        run: npx --yes @tauri-apps/cli@2 icon ../assets/office-icon-1024.png --output src-tauri/icons
      - name: Build Setup
        working-directory: setup
        run: npx --yes @tauri-apps/cli@2 build --no-bundle
      - name: Collect Setup
        shell: pwsh
        run: |
          Copy-Item setup/src-tauri/target/release/fmoffice-setup.exe dist/FmOffice-Setup.exe
          Get-ChildItem dist | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length/1MB) }

      - uses: actions/upload-artifact@v4
        with: { name: fmoffice-windows, path: dist/* }
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  other-platforms:
    needs: test-engine
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npx --yes @tauri-apps/cli@2 icon assets/sheets-icon-1024.png --output src-tauri/icons
      - run: npx --yes @tauri-apps/cli@2 build
      - uses: actions/upload-artifact@v4
        with:
          name: fmoffice-sheets-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
